<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FCF1D4"/>
      <stop offset="100%" stop-color="#FCF6DC"/>
    </linearGradient>
    <linearGradient id="headerGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#44A4D8"/>
      <stop offset="100%" stop-color="#4A8EAC"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#4C1A0F" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="800" height="600" fill="url(#bgGrad)"/>

  <!-- Main Window Mockup -->
  <g filter="url(#shadow)">
    <rect x="50" y="40" width="700" height="520" rx="16" fill="#FFFFFF" stroke="#44A4D8" stroke-width="2" stroke-opacity="0.3"/>

    <!-- App Header Bar -->
    <path d="M 50 56 Q 50 40 66 40 L 734 40 Q 750 40 750 56 L 750 100 L 50 100 Z" fill="url(#headerGrad)"/>

    <!-- Window Dots -->
    <circle cx="80" cy="70" r="7" fill="#A2321D"/>
    <circle cx="102" cy="70" r="7" fill="#F68E0B"/>
    <circle cx="124" cy="70" r="7" fill="#44A4D8"/>

    <!-- App Title in Header -->
    <text x="160" y="76" fill="#FCF6DC" font-family="system-ui, -apple-system, sans-serif" font-weight="bold" font-size="20">🖼️ DeepPhotos — Self-Hosted Vault</text>

    <!-- Header Status Pill -->
    <rect x="610" y="58" width="115" height="26" rx="13" fill="#FCF6DC" fill-opacity="0.2"/>
    <circle cx="625" cy="71" r="4" fill="#67E8F9"/>
    <text x="636" y="75" fill="#FCF6DC" font-family="system-ui, sans-serif" font-weight="600" font-size="12">Docker Active</text>

    <!-- Left Sidebar -->
    <rect x="50" y="100" width="180" height="460" fill="#FCF1D4" fill-opacity="0.5"/>

    <!-- Sidebar Menu Items -->
    <!-- Photos (Active) -->
    <rect x="65" y="125" width="150" height="38" rx="8" fill="#44A4D8"/>
    <text x="85" y="149" fill="#FFFFFF" font-family="system-ui, sans-serif" font-weight="bold" font-size="14">📸 All Photos</text>

    <!-- Albums -->
    <rect x="65" y="175" width="150" height="38" rx="8" fill="transparent"/>
    <text x="85" y="199" fill="#4C1A0F" font-family="system-ui, sans-serif" font-weight="600" font-size="14">📁 Albums</text>

    <!-- Locked Vault -->
    <rect x="65" y="225" width="150" height="38" rx="8" fill="transparent"/>
    <text x="85" y="249" fill="#4C1A0F" font-family="system-ui, sans-serif" font-weight="600" font-size="14">🔒 Secure Vault</text>

    <!-- Documents -->
    <rect x="65" y="275" width="150" height="38" rx="8" fill="transparent"/>
    <text x="85" y="299" fill="#4C1A0F" font-family="system-ui, sans-serif" font-weight="600" font-size="14">📄 Documents</text>

    <!-- Storage Info Widget -->
    <rect x="65" y="440" width="150" height="100" rx="12" fill="#FFFFFF" stroke="#F68E0B" stroke-width="1.5" stroke-opacity="0.5"/>
    <text x="78" y="465" fill="#4C1A0F" font-family="system-ui, sans-serif" font-weight="bold" font-size="12">MinIO Object Store</text>
    <rect x="78" y="475" width="124" height="8" rx="4" fill="#FCF1D4"/>
    <rect x="78" y="475" width="85" height="8" rx="4" fill="#F68E0B"/>
    <text x="78" y="505" fill="#4A8EAC" font-family="system-ui, sans-serif" font-weight="bold" font-size="11">68% Space Used</text>
    <text x="78" y="525" fill="#4C1A0F" fill-opacity="0.6" font-family="system-ui, sans-serif" font-size="10">UUIDv4 Partitioning</text>

    <!-- Main Content Area Grid -->
    <rect x="250" y="120" width="480" height="40" rx="8" fill="#FCF6DC" fill-opacity="0.6" stroke="#44A4D8" stroke-width="1" stroke-opacity="0.3"/>
    <text x="270" y="145" fill="#4C1A0F" fill-opacity="0.5" font-family="system-ui, sans-serif" font-size="13">🔍 Search photos, tags, albums, camera metadata...</text>

    <!-- Photo Thumbnails Grid -->
    <!-- Card 1 -->
    <rect x="250" y="180" width="145" height="150" rx="10" fill="#E2E8F0"/>
    <circle cx="322" cy="245" r="30" fill="#44A4D8" fill-opacity="0.3"/>
    <polygon points="275,300 310,260 335,285 365,245 385,300" fill="#44A4D8"/>
    <circle cx="355" cy="220" r="10" fill="#F68E0B"/>
    <rect x="250" y="300" width="145" height="30" rx="0" fill="#FCF1D4"/>
    <text x="260" y="320" fill="#4C1A0F" font-family="system-ui, sans-serif" font-weight="600" font-size="11">IMG_2026_Mountain.jpg</text>

    <!-- Card 2 -->
    <rect x="415" y="180" width="145" height="150" rx="10" fill="#E2E8F0"/>
    <rect x="415" y="180" width="145" height="120" fill="#F7BBAB" fill-opacity="0.4"/>
    <path d="M 440 280 C 460 220, 510 240, 540 210" stroke="#F68E0B" stroke-width="4" fill="transparent"/>
    <circle cx="480" cy="215" r="16" fill="#F68E0B" fill-opacity="0.8"/>
    <rect x="415" y="300" width="145" height="30" rx="0" fill="#FCF1D4"/>
    <text x="425" y="320" fill="#4C1A0F" font-family="system-ui, sans-serif" font-weight="600" font-size="11">Sunset_Camp.png</text>

    <!-- Card 3 -->
    <rect x="580" y="180" width="150" height="150" rx="10" fill="#E2E8F0"/>
    <circle cx="655" cy="240" r="35" fill="#4A8EAC" fill-opacity="0.3"/>
    <rect x="610" y="240" width="90" height="50" rx="6" fill="#44A4D8"/>
    <rect x="580" y="300" width="150" height="30" rx="0" fill="#FCF1D4"/>
    <text x="590" y="320" fill="#4C1A0F" font-family="system-ui, sans-serif" font-weight="600" font-size="11">Workstation_Setup.jpg</text>

    <!-- Row 2 -->
    <!-- Card 4 -->
    <rect x="250" y="350" width="145" height="150" rx="10" fill="#E2E8F0"/>
    <rect x="250" y="350" width="145" height="120" fill="#44A4D8" fill-opacity="0.2"/>
    <circle cx="322" cy="410" r="28" fill="#F68E0B" fill-opacity="0.5"/>
    <rect x="250" y="470" width="145" height="30" rx="0" fill="#FCF1D4"/>
    <text x="260" y="490" fill="#4C1A0F" font-family="system-ui, sans-serif" font-weight="600" font-size="11">Architecture_Diagram.png</text>

    <!-- Card 5 (Vault card) -->
    <rect x="415" y="350" width="145" height="150" rx="10" fill="#FCF1D4" stroke="#F68E0B" stroke-dasharray="4 4" stroke-width="1.5"/>
    <rect x="465" y="390" width="45" height="35" rx="6" fill="#4C1A0F"/>
    <path d="M 473 390 L 473 378 Q 473 368 487 368 Q 501 368 501 378 L 501 390" fill="none" stroke="#4C1A0F" stroke-width="4"/>
    <circle cx="487" cy="405" r="4" fill="#F68E0B"/>
    <rect x="415" y="470" width="145" height="30" fill="#F7BBAB" fill-opacity="0.5"/>
    <text x="430" y="490" fill="#4C1A0F" font-family="system-ui, sans-serif" font-weight="bold" font-size="11">Encrypted Vault</text>

    <!-- Card 6 -->
    <rect x="580" y="350" width="150" height="150" rx="10" fill="#E2E8F0"/>
    <rect x="580" y="350" width="150" height="120" fill="#4A8EAC" fill-opacity="0.2"/>
    <polygon points="600,460 635,420 660,445 690,405 715,460" fill="#4A8EAC"/>
    <rect x="580" y="470" width="150" height="30" rx="0" fill="#FCF1D4"/>
    <text x="590" y="490" fill="#4C1A0F" font-family="system-ui, sans-serif" font-weight="600" font-size="11">Family_Vacation_2026.jpg</text>

    <!-- Bottom Badge Pills -->
    <rect x="250" y="520" width="85" height="24" rx="12" fill="#44A4D8"/>
    <text x="265" y="536" fill="#FFFFFF" font-family="system-ui, sans-serif" font-weight="bold" font-size="11">⚡ Svelte</text>

    <rect x="345" y="520" width="60" height="24" rx="12" fill="#4A8EAC"/>
    <text x="360" y="536" fill="#FFFFFF" font-family="system-ui, sans-serif" font-weight="bold" font-size="11">🐹 Go</text>

    <rect x="415" y="520" width="70" height="24" rx="12" fill="#F68E0B"/>
    <text x="428" y="536" fill="#FFFFFF" font-family="system-ui, sans-serif" font-weight="bold" font-size="11">🗄️ SQLite</text>

    <rect x="495" y="520" width="70" height="24" rx="12" fill="#A2321D"/>
    <text x="508" y="536" fill="#FFFFFF" font-family="system-ui, sans-serif" font-weight="bold" font-size="11">🦅 MinIO</text>

    <rect x="575" y="520" width="75" height="24" rx="12" fill="#44A4D8"/>
    <text x="587" y="536" fill="#FFFFFF" font-family="system-ui, sans-serif" font-weight="bold" font-size="11">🐳 Docker</text>
  </g>
</svg>
